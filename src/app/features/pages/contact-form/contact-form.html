<section class="section container">
  <!--
    Static form: no action, no submit handler. The button is inert on purpose so the page cannot
    imply a request was sent while there is no endpoint behind it.
  -->
  <form class="contact-form" novalidate>
    <div class="contact-form__row">
      <div class="field">
        <label class="field__label" for="cf-first">
          <span class="field__required" [attr.aria-label]="t().required">*</span> {{ t().firstName }}
        </label>
        <input class="field__input" id="cf-first" name="firstName" type="text" [placeholder]="t().firstNamePlaceholder" />
      </div>

      <div class="field">
        <label class="field__label" for="cf-last">
          <span class="field__required" [attr.aria-label]="t().required">*</span> {{ t().lastName }}
        </label>
        <input class="field__input" id="cf-last" name="lastName" type="text" [placeholder]="t().lastNamePlaceholder" />
      </div>

      <div class="field">
        <label class="field__label" for="cf-nid">
          <span class="field__required" [attr.aria-label]="t().required">*</span> {{ t().nationalId }}
        </label>
        <input class="field__input" id="cf-nid" name="nationalId" type="text" inputmode="numeric" [placeholder]="t().nationalIdPlaceholder" />
      </div>
    </div>

    <div class="contact-form__row">
      <div class="field">
        <label class="field__label" for="cf-email">
          <span class="field__required" [attr.aria-label]="t().required">*</span> {{ t().email }}
        </label>
        <input class="field__input" id="cf-email" name="email" type="email" dir="ltr" [placeholder]="t().emailPlaceholder" />
      </div>

      <div class="field">
        <label class="field__label" for="cf-mobile">
          <span class="field__required" [attr.aria-label]="t().required">*</span> {{ t().mobile }}
        </label>
        <div class="field__group">
          <span class="field__prefix" dir="ltr">
            +966
            <svg class="field__prefix-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 7.5 10 12.5 15 7.5" />
            </svg>
          </span>
          <input class="field__input field__input--grouped" id="cf-mobile" name="mobile" type="tel" dir="ltr" [placeholder]="t().mobilePlaceholder" />
        </div>
      </div>
    </div>

    <div class="contact-form__row">
      <div class="field">
        <label class="field__label" for="cf-type">
          <span class="field__required" [attr.aria-label]="t().required">*</span> {{ t().requestType }}
        </label>
        <select class="field__input field__select" id="cf-type" name="requestType">
          <option value="" selected>{{ t().requestTypePlaceholder }}</option>
        </select>
      </div>

      <div class="field">
        <label class="field__label" for="cf-subject">
          <span class="field__required" [attr.aria-label]="t().required">*</span> {{ t().subject }}
        </label>
        <input class="field__input" id="cf-subject" name="subject" type="text" [placeholder]="t().subjectPlaceholder" />
      </div>
    </div>

    <div class="contact-form__row">
      <div class="field">
        <label class="field__label" for="cf-details">
          <span class="field__required" [attr.aria-label]="t().required">*</span> {{ t().details }}
        </label>
        <textarea class="field__input field__textarea" id="cf-details" name="details" rows="4" [placeholder]="t().detailsPlaceholder"></textarea>
      </div>

      <div class="field">
        <span class="field__label field__label--block">{{ t().attachments }}</span>
        <p class="field__hint">{{ t().attachmentsHint }}</p>
        <label class="field__browse" for="cf-file">{{ t().browse }}</label>
        <input class="field__file" id="cf-file" name="attachment" type="file" accept=".pdf,.jpg,.jpeg,.png" />
      </div>
    </div>

    <button class="contact-form__submit" type="button">{{ t().submit }}</button>
  </form>
</section>
