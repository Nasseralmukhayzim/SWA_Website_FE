@if (showImage()) {
  <img [src]="src()" [alt]="resolvedAlt()" [class]="'media-image--' + variant()" (error)="onError()" />
} @else if (showPlaceholder()) {
  <span [class]="'media-image-placeholder media-image-placeholder--' + variant()" role="img" [attr.aria-label]="resolvedAlt() || 'No image available'">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5" />
      <circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="1.5" />
      <path d="M21 15l-5-5-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>
}
